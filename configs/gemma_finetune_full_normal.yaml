# Section 4: Full-parameter fine-tuning on gemma-2b-it, Normal (DN) data.
# Runs the ORIGINAL, unmodified Code/Fine_tune/Full_finetuning.py via
# run_config.py -- see that file's docstring. Hyperparameters from
# Appendix Table 6 (learning rate for gemma-2b-it: 1e-4, NOT the script's
# own 3e-4 default) -- cross-referenced against
# silu101/safety-layers-repo's docs/KNOWN_DISCREPANCIES.md #6.

script: Code/Fine_tune/Full_finetuning.py
run_name: gemma_full_normal

args:
  base_model: google/gemma-2b-it
  data_path: ../../Dataset/Finetune/Normal_dataset.json
  output_dir: ../../output_models/gemma_full_normal
  batch_size: 128
  # micro_batch_size reduced 4 -> 1 (gradient_accumulation_steps 32 -> 128)
  # to fit the L40S's 48GB VRAM -- Full FT OOM'd inside AdamW.step() at the
  # original micro_batch_size=4, short by only 128MB, even with
  # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True (ruled out
  # fragmentation as the cause). Gradient accumulation with a smaller
  # micro-batch produces the SAME effective batch_size=128 and the same
  # result -- this is not a hyperparameter deviation, it's the memory/
  # speed tradeoff the original script's own batch_size/micro_batch_size
  # split was designed for.
  micro_batch_size: 1
  num_epochs: 3
  learning_rate: 1e-4
  cutoff_len: 256
  val_set_size: 100
  prompt_template_name: alpaca
