# Section 4: Full-parameter fine-tuning on gemma-2b-it, Normal (DN) data.
# Runs the ORIGINAL, unmodified Code/Fine_tune/Full_finetuning.py via
# run_config.py -- see that file's docstring. Hyperparameters from
# Appendix Table 6 (learning rate for gemma-2b-it: 1e-4, NOT the script's
# own 3e-4 default) -- cross-referenced against
# silu101/safety-layers-repo's docs/KNOWN_DISCREPANCIES.md #6.

script: Code/Fine_tune/Full_finetuning.py
run_name: gemma_full_normal

# CUDA OOM inside AdamW.step() (fixed, batch-size-independent optimizer-
# state memory) persisted even at micro_batch_size=1 and with
# PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True. use_deepspeed: true
# (see run_config.py) offloads Adam's momentum/variance buffers to system
# RAM via DeepSpeed ZeRO-2, launched through `accelerate` -- Full_finetuning.py
# itself is NOT modified; HF's Trainer auto-detects DeepSpeed from the
# accelerate-launch environment. Reverted micro_batch_size back to the
# script's own default (4) since it's no longer needed for memory.
use_deepspeed: true

args:
  base_model: google/gemma-2b-it
  data_path: ../../Dataset/Finetune/Normal_dataset.json
  output_dir: ../../output_models/gemma_full_normal
  batch_size: 128
  micro_batch_size: 4
  num_epochs: 3
  learning_rate: 1e-4
  cutoff_len: 256
  val_set_size: 100
  prompt_template_name: alpaca
