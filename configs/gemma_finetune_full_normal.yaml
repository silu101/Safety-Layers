# Section 4: Full-parameter fine-tuning on gemma-2b-it, Normal (DN) data.
# Runs the ORIGINAL, unmodified Code/Fine_tune/Full_finetuning.py via
# run_config.py -- see that file's docstring. Hyperparameters from
# Appendix Table 6 (learning rate for gemma-2b-it: 1e-4, NOT the script's
# own 3e-4 default) -- cross-referenced against
# silu101/safety-layers-repo's docs/KNOWN_DISCREPANCIES.md #6.

script: Code/Fine_tune/Full_finetuning.py
run_name: gemma_full_normal

# CUDA OOM inside AdamW.step() (fixed, batch-size-independent optimizer-
# state memory) persisted even at micro_batch_size=1 and with
# PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True. A CPU-offload
# DeepSpeed variant was tried next but failed to build its cpu_adam op in
# this container. use_deepspeed: true + num_processes: 4 (see
# run_config.py) instead shards Adam's optimizer state across 4 GPUs via
# DeepSpeed ZeRO-2 -- needs instance_type=ml.g6e.12xlarge (4x L40S) in
# sagemaker_launch.py, not g6e.xlarge. Full_finetuning.py itself is NOT
# modified; HF's Trainer auto-detects DeepSpeed from the accelerate-launch
# environment, and the script's own existing world_size/ddp handling
# already divides gradient_accumulation_steps by world_size, preserving
# the same effective batch_size=128 across 4 processes.
use_deepspeed: true
num_processes: 4

args:
  base_model: google/gemma-2b-it
  data_path: ../../Dataset/Finetune/Normal_dataset.json
  output_dir: ../../output_models/gemma_full_normal
  batch_size: 128
  micro_batch_size: 4
  num_epochs: 3
  learning_rate: 1e-4
  cutoff_len: 256
  val_set_size: 100
  prompt_template_name: alpaca
