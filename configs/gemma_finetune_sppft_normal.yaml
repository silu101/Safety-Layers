# Section 4: SPPFT on gemma-2b-it, Normal (DN) data.
# begin_num=5, end_num=12 -- NOT 6,12 -- because SPPFT.py's freeze
# condition is `begin_num < layer_number < end_num`, a STRICT inequality
# that excludes both endpoints. To freeze gemma's confirmed safety-layer
# range [6,11] inclusive (per Appendix A.4.5's "Safety Layers:[6,11]"
# label), this is the correct call: 5 < x < 12 -> x in {6,...,11}.
# Cross-referenced against silu101/safety-layers-repo's
# docs/KNOWN_DISCREPANCIES.md #13, #15.

script: Code/Fine_tune/SPPFT.py
run_name: gemma_sppft_normal

args:
  base_model: google/gemma-2b-it
  data_path: ../../Dataset/Finetune/Normal_dataset.json
  output_dir: ../../output_models/gemma_sppft_normal
  if_freeze: true
  begin_num: 5
  end_num: 12
  batch_size: 128
  micro_batch_size: 4
  num_epochs: 3
  learning_rate: 1e-4
  cutoff_len: 256
  val_set_size: 100
  prompt_template_name: alpaca
